name: Test pull request

on:
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch: 
  

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Zero-K
    # `zk` is a self-hosted runner registered on ZeroK-RTS/Zero-K-Infrastructure. Self-hosted
    # runners do not come with a fork, so on this one the label matches nothing and every run of
    # this workflow queues until GitHub expires it - which is why no pull request here has ever
    # compiled MissionEditor, CMissionLib, ZeroKLobby or run Tests.dll.
    #
    # Nothing in the steps below is machine-specific: setup-msbuild, setup-nuget and Setup-VSTest
    # all provision a GitHub-hosted Windows image, and there is no database, game install or
    # absolute path involved except one publish profile that writes to c:\temp\mb, which a
    # FileSystem publish creates.
    #
    # NOTE FOR UPSTREAM: this line is a fork-local change. Upstream has the runner and should keep
    # `runs-on: zk`.
    runs-on: windows-latest

    steps:
      - name: Setup MSBuild Path
        uses: microsoft/setup-msbuild@v1.1  
        with:
          msbuild-architecture: x64
        
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1.0.5        
        
      - name: Setup VSTest.console.exe
        uses: darenm/Setup-VSTest@v1        

      - name: Checkout
        uses: actions/checkout@v2
        with: 
          clean: true
      
      - name: Restore NuGet Packages
        run: nuget restore Zero-K.sln
 
      - name: Build entire Zero-K
        run: >
          msbuild /t:Rebuild /p:Configuration=Release /p:Platform=x64 
          /p:DeployOnBuild=true /p:PublishProfile=Profile1
          /p:DefineConstants="RELEASE"
          /p:DefineConstants="TRACE" 
          /p:DefineConstants="TEST" 
          Zero-K.sln

      - name: Run VSTest
        run: vstest.console.exe /Platform:x64 /Framework:Framework45 /TestCaseFilter:TestCategory=Basic /Parallel /Logger:trx;LogFileName=test-results.trx ./Tests/bin/release/net48/Tests.dll
        shell: cmd
        
      - name: Test Report C#
        if: (github.event.pull_request.head.repo.full_name == github.repository) && (success() || failure()) # run this step even if previous step failed but not on PR from forked repo
        uses: dorny/test-reporter@v1
        with:
          name: Test results C#           # Name of the check run which will be created
          path: TestResults/test-results.trx
          reporter: dotnet-trx

