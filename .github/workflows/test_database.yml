# The WHR pipeline tests (Tests.Database), against a real SQL Server and the committed
# fixture.
#
# Slower and heavier than test_portable.yml - it pulls SQL Server and mono, builds the
# ZkData chain twice and runs an actual rating computation - about two minutes. It runs on
# every pull request all the same, because it is a required check: a required check that
# is skipped never reports, and the pull request waits for it forever.
#
# It uses exactly the scripts a developer uses locally (db/README.md). If this job breaks,
# the same commands reproduce it on a laptop.
#
# Timing, measured locally: 37s from empty build directories with the images and the NuGet
# cache already warm. On a cold runner add the SQL Server and mono image pulls and, on a
# cache miss, the NuGet restore - a few minutes either way.

name: Database tests

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The name is the required status check on master, so it is not free to change:
    # renaming the job renames the context, branch protection keeps waiting for the old
    # one, and every pull request blocks on a check that will never report again. It now
    # covers the EF Core port as well, which the name does not say.
    name: WHR pipeline (net48 under mono, SQL Server 2022)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DB_NAME: zk_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Both db/dbsetup.sh and db/run-db-tests.sh restore into this directory. Restoring
      # the ZkData chain from scratch is most of the job's runtime.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zk-mono-nuget
            ~/.cache/zk-website-build
          key: zk-mono-nuget-${{ hashFiles('**/*.csproj', '**/packages.config') }}
          restore-keys: zk-mono-nuget-

      # The .NET 9 SDK runs from a container (tools/dotnet.sh) and restores into the
      # runner's own NuGet directory, which the mono cache above does not cover.
      - name: Cache NuGet packages for the .NET 9 SDK
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: zk-net9-nuget-${{ hashFiles('ZkData.Core/ZkData.Core.csproj') }}
          restore-keys: zk-net9-nuget-

      - name: Start SQL Server
        run: |
          docker compose -f db/docker-compose.yml up -d
          ./db/wait-for-db.sh

      - name: Create the schema
        run: ./db/dbsetup.sh latest

      # The migrations are the only thing that should change this schema. If a pull
      # request changes it without updating the snapshot, that is either an accident or a
      # deliberate change someone forgot to record - both worth stopping for.
      - name: Check the schema against the committed snapshot
        run: ./db/dump-schema.py --check

      - name: Load the test fixture
        run: ./db/load-fixture.sh

      # The Framework build, which nothing in CI did until now. It compiles eight projects -
      # the website, ZkLobbyServer, ZkData, PlasmaShared, LobbyClient and the rest - so it is
      # what catches a change that compiles on .NET 9 and not on .NET Framework, or the
      # reverse. The port edits production C# in both directions, so both sides need a build.
      #
      # It does NOT compile Razor views: mono ships no aspnet_compiler.exe. That gap is
      # covered as far as it can be by tools/view-port-report.sh in the other workflow.
      #
      # Placed here rather than in test_portable.yml because this job already pulls the
      # mono:6.12 image for the steps above, so the image is warm.
      - name: Build the .NET Framework solution under mono
        run: ./tools/build-website.sh

      - name: Run the WHR pipeline tests
        run: ./db/run-db-tests.sh

      # The .NET 9 port. Two different questions, and the second one is not implied by the
      # first: whether the EF Core model would BUILD this schema, and whether it can READ
      # this data. A relationship with an invented shadow foreign key answers yes to
      # neither, but only the second one fails loudly - which is how it was found.
      # Placed before the .NET 9 work because it is about the OTHER build: a view edited for the
      # port can be compiled there and only assumed to be valid on MVC 5, which is the stack
      # still serving the site. This asks MVC 5's own Razor parser. It restores nothing itself -
      # build-website.sh above has already pulled Razor 3 into the NuGet cache.
      - name: Check every view still parses as Razor v3 (MVC 5)
        run: ./tools/razor-v3-check/check.sh --all

      # The standalone lobby server is a new project and nothing else builds it, so without this
      # it would rot quietly. build-website.sh takes a project as its argument.
      - name: Build the standalone lobby server
        run: ./tools/build-website.sh ZkLobbyServer.Standalone/ZkLobbyServer.Standalone.csproj

      - name: Check the EF Core model against the EF6 schema
        run: ./db/efcore-schema.sh --check

      - name: Read the fixture through the EF Core model
        env:
          ZK_CONNECTION_STRING: "Data Source=127.0.0.1,14330;Initial Catalog=zk_test;User ID=sa;Password=ZkLocal!Dev2026;MultipleActiveResultSets=true;TrustServerCertificate=true"
        run: ./tools/dotnet.sh run --project ZkData.Core -- read

      # Writing is a third question again: EF6's SaveChanges ran entity hooks and validated
      # the annotations, and EF Core's does neither by itself. Everything here happens in a
      # transaction that is rolled back, and the last check confirms the fixture is
      # untouched - so this step runs before nothing and after anything.
      - name: Write to the fixture through the EF Core model
        env:
          ZK_CONNECTION_STRING: "Data Source=127.0.0.1,14330;Initial Catalog=zk_test;User ID=sa;Password=ZkLocal!Dev2026;MultipleActiveResultSets=true;TrustServerCertificate=true"
        run: ./tools/dotnet.sh run --project ZkData.Core -- write

      # The check §7 of the modernization plan asks for by name: EF6 -> EF Core behaviour
      # drift, measured on the heaviest query in the system rather than argued about. Both
      # runs use the same pipeline source and the same fixture; only the data layer differs.
      # Runs last because each run clears and recomputes AccountRatings.
      - name: Compare the ratings the two stacks compute
        run: ./db/compare-ratings.sh

      # Compilation is not rendering. ZeroKWeb.Core proves the views compile; this renders
      # one on .NET 9 with a row read through EF Core and checks the HTML against the row.
      # Needs the database, which is why it lives in this workflow rather than the portable one.
      - name: Render a view on .NET 9
        env:
          ZK_CONNECTION_STRING: "Data Source=127.0.0.1,14330;Initial Catalog=zk_test;User ID=sa;Password=ZkLocal!Dev2026;MultipleActiveResultSets=true;TrustServerCertificate=true"
        run: ./tools/render-view.sh

      # Routing, a controller and a request - none of which the other two harnesses have,
      # and all of which the views need: they are full of Html.ActionLink.
      - name: Serve a view over HTTP on .NET 9
        env:
          ZK_CONNECTION_STRING: "Data Source=127.0.0.1,14330;Initial Catalog=zk_test;User ID=sa;Password=ZkLocal!Dev2026;MultipleActiveResultSets=true;TrustServerCertificate=true"
        run: ./tools/run-host.sh

      - name: SQL Server log
        if: failure()
        run: docker logs zk-db --tail 80

      # The mono container runs as root, so everything it wrote into the cache is
      # root-owned. actions/cache saves as the runner user in a post-step and would fail
      # on those files, so hand them back first.
      - name: Make the NuGet cache readable by the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" ~/.cache/zk-mono-nuget || true

      - name: Stop SQL Server
        if: always()
        run: docker compose -f db/docker-compose.yml down -v
